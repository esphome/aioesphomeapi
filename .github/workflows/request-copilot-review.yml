name: Request Copilot review

# Requests a Copilot code review on ready pull requests against main, when
# they are opened, reopened or marked ready for review (not on every push).
# Token, seat and Triage details: esphome/workflows request-copilot-review.yml.

on:
  workflow_run:
    workflows: [PR event]
    types: [completed]
  schedule:
    - cron: "17 * * * *"  # catches doorbell runs that were held for approval
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true

permissions: {}

jobs:
  request:
    name: Request Copilot review
    # yamllint disable-line rule:line-length
    uses: esphome/workflows/.github/workflows/request-copilot-review.yml@7f0b0f230ba1b9fa1361e699b3a2043c92f0d3f3  # 2026.11.1
    permissions:
      contents: read  # the shared workflow checks out its own script
      pull-requests: read  # the shared workflow lists open pull requests
    with:
      pr-number: ${{ inputs.pr-number }}
      base-branch: main  # the old trigger only covered main
    secrets:
      COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
