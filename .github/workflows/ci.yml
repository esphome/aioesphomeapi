name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }} py ${{ matrix.python-version }} on ${{ matrix.os }} (${{ matrix.extension }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
          - "3.14t"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        extension:
          - "skip_cython"
          - "use_cython"
        exclude:
          - python-version: "3.14"
            os: windows-latest
          - python-version: "3.14"
            os: macos-latest
          - python-version: "3.14t"
            os: windows-latest
          - python-version: "3.14t"
            os: macos-latest
          - extension: "use_cython"
            os: windows-latest
          - extension: "use_cython"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python environment (no cython)
        if: ${{ matrix.extension == 'skip_cython' }}
        env:
          SKIP_CYTHON: 1
        shell: bash
        run: |
          uv pip install --system -r requirements/base.txt -r requirements/test.txt
          uv pip install --system -e .
      - name: Set up Python environment (cython)
        if: ${{ matrix.extension == 'use_cython' }}
        env:
          REQUIRE_CYTHON: 1
        shell: bash
        run: |
          uv pip install --system -r requirements/base.txt -r requirements/test.txt
          uv pip install --system -e .
      - name: Register problem matchers
        shell: bash
        run: |
          echo "::add-matcher::.github/workflows/matchers/pylint.json"
          echo "::add-matcher::.github/workflows/matchers/mypy.json"
          echo "::add-matcher::.github/workflows/matchers/pytest.json"

      - run: ruff format --check aioesphomeapi tests
        name: Check ruff formatting
        if: ${{ matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - run: ruff check aioesphomeapi tests
        name: Check with ruff
        if: ${{ matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - run: mypy aioesphomeapi
        name: Check typing with mypy
        if: ${{ matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - run: |
          docker run \
            -v "$PWD":/aioesphomeapi \
            -u "$(id -u):$(id -g)" \
            ghcr.io/esphome/aioesphomeapi-proto-builder:latest
          if ! git diff --quiet; then
            echo "You have altered the generated proto files but they do not match what is expected."
            echo "Please run the following to update the generated files:"
            echo 'docker run -v "$PWD":/aioesphomeapi ghcr.io/esphome/aioesphomeapi-proto-builder:latest'
            exit 1
          fi
        name: Check protobuf files match
        if: ${{ matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - name: Show changes
        run: git diff
        if: ${{ failure() && matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - name: Archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: genrated-proto-files
          path: aioesphomeapi/*pb2.py
        if: ${{ failure() && matrix.python-version == '3.14' && matrix.extension == 'skip_cython' && matrix.os == 'ubuntu-latest' }}
      - run: pytest -q -n auto --cov=aioesphomeapi --cov-report=xml --timeout=4 --tb=native --ignore=tests/benchmarks tests
        name: Run tests with pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python environment (cython)
        env:
            REQUIRE_CYTHON: 1
        shell: bash
        run: |
            uv pip install --system -r requirements/base.txt -r requirements/test.txt
            uv pip install --system -e .
      - name: Bound apt fetches and pre-install libc6-dbg
        # The CodSpeed runner installs valgrind + libc6-dbg via its own
        # unbounded apt-get update; per-invocation apt options cannot reach
        # it. The apt.conf.d timeouts below bound every later apt call in
        # this job, the runner's included. Pre-installing libc6-dbg lets the
        # runner skip apt once its valgrind cache is restored (it checks
        # ``dpkg -s libc6-dbg``, so the cache action's unregistered restores
        # would not count). Install without update first: image lists are
        # fresh, and the index refresh is what a congested mirror makes
        # slow. Best effort; the job timeout is the last backstop.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeouts >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          if dpkg -s libc6-dbg >/dev/null 2>&1; then
            echo "libc6-dbg already installed"
            exit 0
          fi
          # Common path: the image's package lists are fresh enough.
          if sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 90 \
              apt-get install -y libc6-dbg; then
            exit 0
          fi
          # Rescue path: refresh the lists once with a generous bound; the
          # apt config already fails a stalled mirror over quickly.
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 10 30 \
            dpkg --configure -a || true
          sudo timeout -k 15 300 apt-get update
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 300 \
            apt-get install -y libc6-dbg
      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8  # v5.0.3
        with:
          mode: instrumentation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest tests/benchmarks --codspeed --durations=10
